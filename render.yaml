{
  "services": [
    {
      "type": "web",
      "name": "proyecto-noir",
      "runtime": "node",
      "plan": "free",
      "buildCommand": "npm ci",
      "startCommand": "npm start",
      "healthCheckPath": "/health",
      "envVars": [
        {
          "key": "MONGO_URI",
          "sync": false
        },
        {
          "key": "JWT_SECRET",
          "sync": false
        },
        {
          "key": "SESSION_SECRET",
          "sync": false
        },
        {
          "key": "NODE_VERSION",
          "value": "24"
        },
        {
          "key": "CONTENT_ENABLED",
          "value": "false"
        },
        {
          "key": "USERS_SERVICE_URL",
          "value": "https://noir-users.onrender.com"
        },
        {
          "key": "PRODUCTS_SERVICE_URL",
          "value": "https://noir-products.onrender.com"
        },
        {
          "key": "STOCK_SERVICE_URL",
          "value": "https://noir-stock.onrender.com"
        }
      ]
    }
  ]
}
